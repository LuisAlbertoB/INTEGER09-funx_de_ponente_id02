version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password_seguro_root
      MYSQL_DATABASE: campus_event
      MYSQL_USER: campus_user
      MYSQL_PASSWORD: password_seguro_produccion
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    networks:
      - app_network
    command: --default-authentication-plugin=mysql_native_password

  nlp:
    build:
      context: ./nlp_service
      dockerfile: Dockerfile
    container_name: nlp_api
    restart: always
    volumes:
      - nlp_models:/app/models_cache
    networks:
      - app_network

  api:
    build:
      context: ./server
      dockerfile: deploy/Dockerfile
    container_name: node_api
    restart: always
    ports:
      - "80:3000"
    environment:
      DATABASE_URL: "mysql://campus_user:password_seguro_produccion@db:3306/campus_event"
      NLP_SERVICE_URL: "http://nlp:8000"
      JWT_SECRET: "secreto_seguro_monorepo_jwt"
      UPLOAD_DIR: "uploads/materiales"
      PORT: 3000
    depends_on:
      - db
      - nlp
    volumes:
      - uploads_data:/app/uploads
    command: /bin/sh -c "npx prisma db push --accept-data-loss && node prisma/seed.js && npm start"
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mysqldata:
  uploads_data:
  nlp_models:
